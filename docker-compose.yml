  db:
    image: postgres:18.1-alpine3.23
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: denis
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  cache:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    volumes:
      - cache_data:/data

volumes:
  # redis_data:
  db_data:
  cache_data:
