[package]
name = "dnsserver"
version = "0.1.0"
edition = "2024"

[features]
default = ["analytics"]
analytics = ["dep:rdkafka", "dep:clickhouse"]

[profile.release]
# debug = true
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.49.0", features = ["full"] }
hickory-proto = "0.25.2"
thiserror = "2"
clap = { version = "4.5", features = ["derive", "env"] }
arc-swap = "1.7"
ahash = "0.8"
memchr = "2.7"
crossbeam-queue = "0.3"
socket2 = { version = "0.5", features = ["all"] }
core_affinity = "0.8"
rand = "0.8"
argon2 = "0.5"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
redis = { version = "1.0.2", features = [
  "tokio-comp",
  "tokio-native-tls-comp",
] }
deadpool-redis = "0.22.1"
ftlog = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
rdkafka = { version = "0.39", features = ["cmake-build"], optional = true }
clickhouse = { version = "0.12", optional = true }
prometheus = "0.13"
bytes = "1.11.0"
heapless = "0.9.2"
moka = { version = "0.12.13", features = ["future"] }
tokio-stream = "0.1.18"
axum = "0.7"
flume = "0.11"

[dev-dependencies]
hdrhistogram = "7"

[target.'cfg(target_os = "linux")'.dependencies]
monoio = { version = "0.2", features = ["iouring", "legacy", "macros", "sync"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
monoio = { version = "0.2", features = ["legacy", "macros", "sync"] }
